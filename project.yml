name: QueenBee
options:
  bundleIdPrefix: dev.queenbee
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    Release:
      ENABLE_HARDENED_RUNTIME: YES
packages:
  QueenBeeCore:
    path: Core
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.99.0
  swift-subprocess:
    url: https://github.com/swiftlang/swift-subprocess.git
    exactVersion: 1.0.1
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    exactVersion: 2.10.0
targets:
  QueenBee:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Plugin/qb-link
        type: folder
        buildPhase: resources
      # The licenses of the packages the app is built with have to travel with it.
      - path: THIRD-PARTY-NOTICES.md
        buildPhase: resources
    dependencies:
      - package: QueenBeeCore
      - package: SwiftTerm
      - package: swift-subprocess
        product: Subprocess
      - package: Sparkle
      - target: qb
        embed: false
        link: false
    postBuildScripts:
      - name: Embed qb helper
        script: |
          # Copy, then rename over the old one. Writing into the old file would get every new launch of it
          # killed while a running session still has it open.
          cp -f "${BUILT_PRODUCTS_DIR}/qb" "${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}/qb.new"
          mv -f "${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}/qb.new" "${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}/qb"
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/qb
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/qb
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.queenbee.app
        PRODUCT_NAME: QueenBee
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Queen Bee
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.3.4"
        CURRENT_PROJECT_VERSION: "8"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ENABLE_APP_SANDBOX: NO
      configs:
        # A build from source is its own app, "Queen Bee Dev": it runs beside an installed copy
        # and keeps its own settings.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.queenbee.app.debug
          INFOPLIST_KEY_CFBundleDisplayName: Queen Bee Dev
  qb:
    type: tool
    platform: macOS
    sources:
      - path: Helper
    dependencies:
      - package: QueenBeeCore
    settings:
      base:
        PRODUCT_NAME: qb
        SKIP_INSTALL: YES
schemes:
  QueenBee:
    build:
      targets:
        QueenBee: all
    run:
      config: Debug
