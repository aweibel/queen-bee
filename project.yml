name: QueenBee
options:
  bundleIdPrefix: dev.queenbee
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    Release:
      ENABLE_HARDENED_RUNTIME: YES
packages:
  QueenBeeCore:
    path: Core
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.99.0
  swift-subprocess:
    url: https://github.com/swiftlang/swift-subprocess.git
    exactVersion: 1.0.1
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    exactVersion: 2.10.0
targets:
  QueenBee:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Plugin/qb-link
        type: folder
        buildPhase: resources
      # The licenses of the packages the app is built with have to travel with it.
      - path: THIRD-PARTY-NOTICES.md
        buildPhase: resources
    dependencies:
      - package: QueenBeeCore
      - package: QueenBeeCore
        product: QueenBeeLink
      - package: SwiftTerm
      - package: swift-subprocess
        product: Subprocess
      - package: Sparkle
      - target: qb
        embed: false
        link: false
    postBuildScripts:
      - name: Embed qb helper
        script: |
          # Copy, then rename over the old one. Writing into the old file would get every new launch of it
          # killed while a running session still has it open.
          cp -f "${BUILT_PRODUCTS_DIR}/qb" "${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}/qb.new"
          mv -f "${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}/qb.new" "${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}/qb"
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/qb
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/qb
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.queenbee.app
        PRODUCT_NAME: QueenBee
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Queen Bee
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.5.0"
        CURRENT_PROJECT_VERSION: "10"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ENABLE_APP_SANDBOX: NO
      configs:
        # A build from source is its own app, "Queen Bee Dev": it runs beside an installed copy
        # and keeps its own settings.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.queenbee.app.debug
          INFOPLIST_KEY_CFBundleDisplayName: Queen Bee Dev
  qb:
    type: tool
    platform: macOS
    sources:
      - path: Helper
    dependencies:
      - package: QueenBeeCore
    settings:
      base:
        PRODUCT_NAME: qb
        SKIP_INSTALL: YES
  qb-remote-check:
    type: tool
    platform: macOS
    sources:
      - path: Tools/RemoteCheck
    dependencies:
      - package: QueenBeeCore
      - package: QueenBeeCore
        product: QueenBeeLink
    settings:
      base:
        PRODUCT_NAME: qb-remote-check
        SKIP_INSTALL: YES
  QueenBeeMobile:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Mobile
      # The same icon as the Mac app.
      - path: App/AppIcon.icon
    # The bundle id, version and signing come from here, so a person's own team id never has to be in this file.
    configFiles:
      Debug: Mobile/Config.xcconfig
      Release: Mobile/Config.xcconfig
    dependencies:
      - package: QueenBeeCore
      - package: QueenBeeCore
        product: QueenBeeLink
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_NAME: QueenBeeMobile
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Mobile/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Queen Bee
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        # The settings at the top of this file are the Mac's. The hardened runtime is a Mac thing.
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  QueenBee:
    build:
      targets:
        QueenBee: all
        qb-remote-check: all
    run:
      config: Debug
  # What Xcode's Run installs on your own iPad or iPhone: a Release build, which has none of the test harness in it.
  # scripts/build-mobile.sh and scripts/e2e.py build Debug themselves, by name, because the harness is what they drive.
  QueenBeeMobile:
    build:
      targets:
        QueenBeeMobile: all
    run:
      config: Release
  # For debugging the app from Xcode.
  QueenBeeMobile Debug:
    build:
      targets:
        QueenBeeMobile: all
    run:
      config: Debug
